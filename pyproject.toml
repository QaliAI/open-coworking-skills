[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencoworking"
version = "0.1.0"
description = "Deterministic data tools for the OpenCoworking Skills collection: CSV ingestion, normalization, PII redaction, and coworking metric calculations."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "OpenCoworking Skills contributors" }]
keywords = ["coworking", "flex-space", "agent-skills", "analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Other Audience",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business",
]
# Stdlib-only core: CSV, JSON, dates, and all metrics work with no dependencies.
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10", "pyyaml>=6"]

[project.scripts]
opencoworking = "opencoworking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
files = ["src/opencoworking"]
