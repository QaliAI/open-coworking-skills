# Honest compatibility statements. Labels defined in
# docs/research/coworking-systems.md. Host support verified against the
# sources recorded in docs/research/SOURCES.yaml (accessed 2026-07-17).

hosts:
  # verified: listed on the official Agent Skills client showcase or the
  # host's own documentation, checked on the access date. "community" means
  # support is documented by third parties, not the vendor.
  - name: OpenAI Codex
    support: native
    notes: Reads .agents/skills at repo root; also ~/.agents/skills (user) and /etc/codex/skills (admin).
  - name: Claude Code
    support: native
    notes: Agent Skills standard; project skills in .claude/skills - see docs/platform-installation/claude-code.md for using this repo's .agents/skills.
  - name: GitHub Copilot / VS Code
    support: native
    notes: Installable via gh skill install into .agents/skills.
  - name: Cursor
    support: native
    notes: Per official client showcase; see vendor setup docs.
  - name: Gemini CLI
    support: native
    notes: Per official client showcase; see vendor setup docs.
  - name: OpenCode
    support: native
    notes: Per official client showcase; see vendor setup docs.
  - name: Kiro
    support: native
    notes: Per official client showcase; see vendor setup docs.
  - name: Windsurf
    support: vendor-documented
    notes: Cascade reads .windsurf/skills per Windsurf docs; requires copying/symlinking - not on the official showcase at access date.
  - name: Cline
    support: community
    notes: Community tooling documents shared .agents/skills use; not vendor-verified by this project.
  - name: Antigravity
    support: community
    notes: Community tooling documents shared .agents/skills use; not vendor-verified by this project.

systems:
  # Label ladder per docs/research/coworking-systems.md. As of 2026-07-18 the
  # highest label held is connector-prototype (mock-tested) - NO system is
  # sandbox- or live-tested.
  - name: Generic CSV / any system with exports
    label: export-supported
    adapter: adapters/generic-csv
  - name: HubSpot
    label: connector-prototype (mock-tested)
    adapter: adapters/hubspot
    notes: Read-only prototype in src/opencoworking/connectors/hubspot.py; mocked tests only, never live-tested (2026-07-18 docs in SOURCES.yaml)
  - name: OfficeRnD
    label: connector-prototype (mock-tested)
    adapter: adapters/officernd
    notes: Read-only prototype in src/opencoworking/connectors/officernd.py; mocked tests only, never live-tested; token endpoint unverified (2026-07-18 docs in SOURCES.yaml)
  - name: Nexudus
    label: mapping-documented
    adapter: adapters/nexudus
  - name: Optix
    label: mapping-documented
    adapter: adapters/optix
  - name: Archie
    label: mapping-documented
    adapter: adapters/archie
