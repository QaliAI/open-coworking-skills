  - name: coworking-context-builder
    category: foundation
    status: stable
    version: "0.1.0"
    risk: r1
    modes: [manual, export]
    primary_user: owner / GM
    problem: Skills re-ask basics and silently assume wrong defaults without a saved operator profile.
    inputs: Operator interview answers; optional inventory/membership exports.
    outputs: operator-profile.md with facts, assumptions, and missing fields separated.
    dependencies: []

