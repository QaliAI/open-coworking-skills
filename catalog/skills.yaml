# Canonical skill catalog. The README table is GENERATED from this file
# (scripts/generate_readme_catalog.py); scripts/check_catalog.py verifies
# consistency with .agents/skills/. Statuses: stable skills exist in
# .agents/skills/; planned skills exist only here and in ROADMAP.md.

skills:
