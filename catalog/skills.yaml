  - name: coworking-source-verifier
    category: foundation
    status: stable
    version: "0.1.0"
    risk: r0
    modes: [manual, export]
    primary_user: owner / GM
    problem: Reports full of unsourced claims and manufactured causes drive bad pricing and expansion decisions.
    inputs: Document or claim; underlying data files for recomputation.
    outputs: Verification table separating facts, calculations, assumptions, hypotheses, unsourced claims.
    dependencies: []

  - name: coworking-pii-redactor
    category: foundation
