# Source and licensing ledger.
# Every outside source considered during development is recorded here BEFORE
# any adaptation. usage values: studied | adapted | copied.
# "studied" means concepts/interfaces only; no text or code was reproduced.

sources:
  - name: Agent Skills specification
    location: https://agentskills.io/specification
    maintainer: Anthropic (published as an open standard)
    date_accessed: "2026-07-17"
    license: Open specification; site content terms apply. Following the format
      is interface use, not copying.
    knowledge_used: SKILL.md frontmatter contract (name/description required;
      license/compatibility/metadata/allowed-tools optional), name constraints
      (<=64 chars, lowercase alnum + hyphens, no leading/trailing/double hyphen,
      must match folder), description <=1024 chars, compatibility <=500 chars,
      progressive disclosure tiers, keep SKILL.md under 500 lines, references
      one level deep.
    usage: studied
    attribution_required: no
    restrictions: none identified

