  - name: GitHub CLI gh skill install manual
    location: https://cli.github.com/manual/gh_skill_install
    maintainer: GitHub
    date_accessed: "2026-07-17"
    license: GitHub documentation terms
    knowledge_used: >-
      'gh skill install OWNER/REPO [skill[@version]]' installs to
      .agents/skills/ at project scope by default; --agent, --scope, --pin,
      --all, --from-local, --force flags. Audit correction 2026-07-18,
      verified against gh 2.92 by execution: hidden directories (including
      .agents/skills) are SKIPPED unless --allow-hidden-dirs is passed; at
      most one named skill per invocation (or --all); gh skill publish
      --dry-run validates skills but only under non-hidden conventions
      unless given an explicit path.
    usage: studied
    attribution_required: no
    restrictions: none identified

