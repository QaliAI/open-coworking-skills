  - name: npm package "skills" (skills CLI)
    location: https://www.npmjs.com/package/skills
    maintainer: skills CLI publishers (package page credits the open agent skills ecosystem and skills.sh)
    date_accessed: "2026-10-19"
    license: MIT, per the package page fetched that day
    knowledge_used: >-
      Package page showed version 1.7.4. Install form is `npx skills add
      owner/repo`. Node.js 22.20 or later. Project install is the default.
      `-g` is user-level. The local CLI help (same day) documents `--list`,
      `--skill`, and `--all` (`--all` means `--skill '*' --agent '*' -y`).
      The CLI states it collects anonymous usage data unless
      DISABLE_TELEMETRY=1 or DO_NOT_TRACK=1. Local test: `--list` on this
      checkout found 37 skills; one skill installed into a temporary project
      for the codex agent with `--copy`. The public GitHub URL was not
      fetched because the repository was still private during the test.
    usage: studied
    attribution_required: no
    restrictions: >-
      Do not claim the public GitHub install succeeded until it is re-run
      after publication. Disclose the CLI telemetry.
