        acceptable: [coworking-source-verifier, coworking-occupancy-revenue-dashboard]
        unacceptable: [coworking-monthly-owner-report]
      - prompt: "Fact-check the causes listed in this churn analysis"
        acceptable: [coworking-source-verifier]
        unacceptable: [coworking-churn-risk-review]

