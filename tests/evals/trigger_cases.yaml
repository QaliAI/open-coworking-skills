# Trigger and collision eval suite.
# Every installable skill: 4 direct positives, 3 indirect positives (natural
# operator language, no skill names), 3 negatives (belong to another named
# skill), 2 ambiguous (any of `acceptable` is fine), 2 collisions
# (`acceptable` = correct set; `unacceptable` = activation failure).
# 34 skills / 476 cases were LLM-judged. The three skills added 2026-10-19
# have structural cases only. Do not describe the new cases as judge-passed.
# Run: python scripts/run_trigger_evals.py  (see the script header for
# what is executed deterministically vs LLM-graded).

skills:
  coworking-context-builder:
    direct_positive:
      - "Build my coworking operator profile"
      - "Set up my space context - two locations, we use OfficeRnD"
      - "Remember our products and pricing for future analyses"
      - "Create the operator profile before we analyze anything"
    indirect_positive:
      - "Before we start, you should know how our business is set up"
      - "You keep asking the same questions about my locations every session"
      - "We call our offices studios and our desks residencies - keep that in mind permanently"
    negative:
      - prompt: "What's in this CSV export from our system?"
        expected: coworking-wms-export-analyzer
      - prompt: "Map these Nexudus columns to your model"
        expected: coworking-data-dictionary
      - prompt: "What's our occupancy right now?"
        expected: coworking-occupancy-revenue-dashboard
    ambiguous:
      - prompt: "Help me get started with all this"
        acceptable: [coworking-context-builder, coworking-wms-export-analyzer]
      - prompt: "Set us up properly"
        acceptable: [coworking-context-builder]
    collision:
      - prompt: "Store how our sales stages map to your model"
        acceptable: [coworking-context-builder, coworking-data-dictionary]
        unacceptable: [coworking-pipeline-health]
      - prompt: "Remember that we define occupancy financially"
        acceptable: [coworking-context-builder]
        unacceptable: [coworking-occupancy-revenue-dashboard]

  coworking-data-dictionary:
    direct_positive:
      - "Map these OfficeRnD export columns to your model"
      - "What does CancellationDate mean in my Nexudus export?"
      - "Build a column mapping for my HubSpot deals export"
      - "Which of these CRM columns is the monthly price?"
    indirect_positive:
      - "My export has columns like Tariff and CoworkerName - which is which?"
      - "The Price column might be per month or for the whole term, not sure"
      - "These headers don't match what your analysis wants"
    negative:
      - prompt: "What kind of data is in this mystery file?"
        expected: coworking-wms-export-analyzer
      - prompt: "Standardize our lead source labels"
        expected: coworking-lead-source-normalizer
      - prompt: "Build my operator profile"
        expected: coworking-context-builder
    ambiguous:
      - prompt: "Get my HubSpot data ready for analysis"
        acceptable: [coworking-data-dictionary, coworking-wms-export-analyzer]
      - prompt: "These columns are confusing"
        acceptable: [coworking-data-dictionary, coworking-wms-export-analyzer]
    collision:
      # Run-2 correction: once crm-wms-reconciliation existed, it became the
      # better routing for this phrasing; both are acceptable.
      - prompt: "My HubSpot contacts don't line up with OfficeRnD"
        acceptable: [coworking-data-dictionary, coworking-crm-wms-reconciliation]
        unacceptable: [coworking-pii-redactor]
      - prompt: "Rename the columns in this export so your tools understand them"
        acceptable: [coworking-data-dictionary]
        unacceptable: [coworking-lead-source-normalizer]

  coworking-source-verifier:
    direct_positive:
      - "Check this owner report for unsupported claims"
