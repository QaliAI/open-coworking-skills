# Routine update batching; security updates are not restricted by version-update limits.
# Deliberate major-version migrations are tracked in issue #9.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      routine-github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      routine-pip:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
