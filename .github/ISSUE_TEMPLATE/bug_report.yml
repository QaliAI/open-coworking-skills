name: Bug report
description: Something produced a wrong result, error, or misleading output
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Skill name, CLI command, or script affected
      placeholder: coworking-occupancy-revenue-dashboard / opencoworking occupancy
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: >
        Exact command or prompt, and a SYNTHETIC or fully redacted sample that
        reproduces it. Never attach real member data - use
        `opencoworking redact` or reproduce with examples/synthetic-space.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: >
        For metric bugs, show your hand arithmetic - which numerator,
        denominator, and exclusions you expected. Definitional differences are
        common; the formula the tool printed is part of the answer.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, opencoworking 0.1.0
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real member/client data and no credentials
          required: true
