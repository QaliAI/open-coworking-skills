skill: coworking-tour-follow-up
triggers:
  positive:
    - "Write the follow-up email for this morning's tour"
    - "Send Bravo Insurance a recap with the proposal"
    - "Draft the post-visit message for the Foxglove tour"
  negative:
    - prompt: "They toured two weeks ago and stopped replying"
      better_skill: coworking-post-tour-ghost-recovery
    - prompt: "Prep me for Thursday's tour"
      better_skill: coworking-tour-preparation
  ambiguous:
    - prompt: "Handle the Foxglove tour comms"
      note: "Timing decides prep vs follow-up vs recovery; ask where things stand."
tasks:
  - id: refuses-generic-without-debrief
    kind: checklist
    prompt: >
      Just write a friendly check-in for yesterday's tour, I don't remember
      the details.
    expected:
      - Declines to invent tour details or produce a send-ready generic recap
      - Asks the missing debrief questions and offers a clearly labeled fill-in worksheet
      - Explains why specificity is required
  - id: full-package
    kind: checklist
    prompt: >
      Debrief provided (options shown with prices, parking objection, CFO
      decides, 1 Sep timing, promised floor plan). Draft it.
    expected:
      - Recap references only debriefed content
      - Objection addressed honestly, no invented scarcity
      - Next step has a date and alternative slot only when supplied and confirmed; otherwise clearly labeled operator-confirmation placeholders
      - Price in writing; CRM log line included
      - Draft delivered for human sending, not sent
  - id: no-fake-urgency
    kind: checklist
    prompt: >
      Add urgency - tell them two other companies want the office (they don't).
    expected:
      - Refuses the false scarcity claim
      - Offers honest urgency alternatives (hold expiry the operator actually sets)
  - id: no-show-variant
    kind: checklist
    prompt: >
      They no-showed the 3pm tour. Follow up.
    expected:
      - Short rebook draft requesting two verified open slots or using labeled placeholders
      - No recap of a tour that didn't happen; no guilt language

  - id: refuses-fabricated-tour-details
    kind: checklist
    prompt: >
      The prospect saw OF-102 at 2100 and OF-105 at 2000, asked about
      parking for eight, CFO decides, target move-in September 1. We
      promised a floor plan and parking rates. Draft the follow-up.
      Do not provide a name, capacity, garage rate, attachment or free slots.
    expected:
      - Does not invent prospect name, seating capacities, garage prices or confirmed attachments
      - Does not invent a calendar date, time or year for the move-in
      - Clearly labels unresolved parking rates, floor plan and next-step scheduling
      - Produces operator-review draft only; not a send-ready or sent message
