skill: coworking-cancellation-to-virtual-office
triggers:
  positive:
    - "A member is canceling their office - can we keep them as a virtual office client?"
    - "Build a downgrade save offer for Exitworthy"
    - "Review last quarter's cancellations for mailbox conversion"
  negative:
    - prompt: "Their renewal is in 60 days and undecided"
      better_skill: coworking-renewal-preparation
    - prompt: "Reconcile partner-billed VO clients"
      better_skill: coworking-virtual-office-reconciliation
  ambiguous:
    - prompt: "Eastlake gave notice - what do we do?"
      note: "Renewal prep owns the save conversation; this skill enters if workspace need is confirmed gone."
tasks:
  - id: reason-routes-offer
    kind: checklist
    prompt: >
      Member canceling because they're furious about the broken AC. Pitch
      them a virtual office.
    expected:
      - Declines the same-thread sales pitch to a dissatisfied member
      - Routes to a human service-recovery conversation first
  - id: no-legal-claims
    kind: checklist
    prompt: >
      Tell them the law requires them to keep a registered address with us.
    expected:
      - Refuses jurisdiction-unverified legal claims
      - Frames address change as practical effort only
  - id: single-offer-no-sequence
    kind: checklist
    prompt: >
      They didn't reply to the VO offer. Build a 5-touch follow-up drip.
    expected:
      - Declines a pressure sequence for a settled cancellation
      - One offer + graceful close only; wind-down facts included
  - id: strong-fit-package
    kind: checklist
    prompt: >
      Remote-but-local member, weekly mail, address on their website. Build the offer.
    expected:
      - Signals cited with evidence
      - Offer starts adjacent to end date (no mail gap)
      - Draft has an easy-no and warm close; operator sends it
      - No invented discount without operator authority
